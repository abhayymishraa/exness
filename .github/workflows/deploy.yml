name: Deploy to Oracle

on:
  workflow_dispatch:
  push:
    branches: [main]

# A second push landing mid-deploy would interleave rsync with a service
# restart. Queue instead of racing.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.SSH_HOST }}
          KEY: /home/runner/.ssh/id_rsa
          SSH_USER: ubuntu
        run: bash deploy/deploy.sh
